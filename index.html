<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UES CUSTOMS · Cambiar contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EEF1;
    --surface: #FFFFFF;
    --ink: #0F2742;
    --muted: #5B6F82;
    --line: #C9D3DB;
    --field: #F6F8F9;
    --accent: #0F2742;
    --accent-text: #FFFFFF;
    --stripe: #E8A317;
    --ok: #1B7A57;
    --bad: #B3341F;
    --focus: #1D6FD6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1624;
      --surface: #11233A;
      --ink: #E6EDF3;
      --muted: #93A7BA;
      --line: #28405A;
      --field: #0D1D31;
      --accent: #E8A317;
      --accent-text: #0A1624;
      --ok: #4CC495;
      --bad: #FF8A75;
      --focus: #6CB0FF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1624; --surface: #11233A; --ink: #E6EDF3; --muted: #93A7BA;
    --line: #28405A; --field: #0D1D31; --accent: #E8A317; --accent-text: #0A1624;
    --ok: #4CC495; --bad: #FF8A75; --focus: #6CB0FF; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .stripe {
    height: 8px;
    background: repeating-linear-gradient(-45deg, var(--stripe) 0 12px, var(--ink) 12px 24px);
  }
  header { padding: 28px 28px 8px; }
  .brand {
    font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    font-weight: 700;
    font-size: 2.4rem;
    line-height: 1;
    letter-spacing: 0.06em;
    margin: 0;
  }
  header p { margin: 10px 0 0; color: var(--muted); font-size: 0.95rem; }
  h2 {
    font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    font-weight: 600;
    font-size: 1.35rem;
    margin: 20px 0 0;
  }
  form { padding: 4px 28px 28px; }
  .field { margin-top: 18px; }
  label { display: block; font-weight: 500; font-size: 0.92rem; margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input {
    width: 100%;
    height: 46px;
    padding: 0 76px 0 12px;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 1px;
  }
  .toggle {
    position: absolute; right: 4px; top: 4px; height: 38px; padding: 0 10px;
    background: none; border: 0; border-radius: 3px;
    color: var(--muted); font: 500 0.85rem "IBM Plex Sans", sans-serif; cursor: pointer;
  }
  .toggle:hover { color: var(--ink); }
  .meter { display: flex; gap: 4px; margin-top: 10px; }
  .meter span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background .2s; }
  .meter[data-level="1"] span:nth-child(-n+1) { background: var(--bad); }
  .meter[data-level="2"] span:nth-child(-n+2) { background: var(--stripe); }
  .meter[data-level="3"] span:nth-child(-n+3) { background: var(--ok); }
  .meter[data-level="4"] span:nth-child(-n+4) { background: var(--ok); }
  .meter-label { font-size: 0.82rem; color: var(--muted); margin: 6px 0 0; min-height: 1.3em; }
  ul.rules { list-style: none; margin: 12px 0 0; padding: 0; font-size: 0.88rem; color: var(--muted); }
  ul.rules li { padding-left: 24px; position: relative; margin-top: 4px; }
  ul.rules li::before {
    content: ""; position: absolute; left: 3px; top: 0.35em; width: 11px; height: 11px;
    border-radius: 50%; border: 2px solid var(--line);
  }
  ul.rules li.met { color: var(--ink); }
  ul.rules li.met::before { background: var(--ok); border-color: var(--ok); }
  .error { color: var(--bad); font-size: 0.85rem; margin: 6px 0 0; min-height: 1.2em; }
  .submit {
    width: 100%; height: 50px; margin-top: 22px;
    background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 4px;
    font: 600 1rem "IBM Plex Sans", sans-serif; cursor: pointer;
  }
  .submit:hover { filter: brightness(1.12); }
  .submit:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .status {
    margin: 18px 0 0; padding: 12px 14px; border-radius: 4px;
    border: 1px solid var(--ok); color: var(--ok); font-weight: 500; display: none;
  }
  .status.show { display: block; }
  @media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }
</style>
</head>
<body>
  <main class="card">
    <div class="stripe" aria-hidden="true"></div>
    <header>
      <h1 class="brand">UES CUSTOMS</h1>
      <p>Administra el acceso a tu cuenta.</p>
      <h2>Cambiar contraseña</h2>
    </header>

    <form id="form" novalidate>
      <div class="field">
        <label for="actual">Contraseña actual</label>
        <div class="input-wrap">
          <input id="actual" type="password" autocomplete="current-password" required>
          <button class="toggle" type="button" data-for="actual" aria-label="Mostrar contraseña actual">Mostrar</button>
        </div>
        <p class="error" id="err-actual"></p>
      </div>

      <div class="field">
        <label for="nueva">Nueva contraseña</label>
        <div class="input-wrap">
          <input id="nueva" type="password" autocomplete="new-password" required>
          <button class="toggle" type="button" data-for="nueva" aria-label="Mostrar nueva contraseña">Mostrar</button>
        </div>
        <div class="meter" id="meter" data-level="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p class="meter-label" id="meter-label" aria-live="polite"></p>
        <ul class="rules" id="rules">
          <li data-rule="len">Al menos 8 caracteres</li>
          <li data-rule="mix">Mayúsculas y minúsculas</li>
          <li data-rule="num">Al menos un número</li>
          <li data-rule="sym">Al menos un símbolo (por ejemplo ! # $)</li>
        </ul>
      </div>

      <div class="field">
        <label for="confirmar">Confirmar nueva contraseña</label>
        <div class="input-wrap">
          <input id="confirmar" type="password" autocomplete="new-password" required>
          <button class="toggle" type="button" data-for="confirmar" aria-label="Mostrar confirmación">Mostrar</button>
        </div>
        <p class="error" id="err-confirmar" aria-live="polite"></p>
      </div>

      <button class="submit" id="submit" type="submit" disabled>Guardar contraseña</button>
      <p class="status" id="status" role="status">Contraseña actualizada correctamente.</p>
    </form>
  </main>

<script>
(function () {
  var actual = document.getElementById('actual');
  var nueva = document.getElementById('nueva');
  var confirmar = document.getElementById('confirmar');
  var submit = document.getElementById('submit');
  var meter = document.getElementById('meter');
  var meterLabel = document.getElementById('meter-label');
  var errActual = document.getElementById('err-actual');
  var errConfirmar = document.getElementById('err-confirmar');
  var status = document.getElementById('status');
  var labels = ['', 'Débil', 'Regular', 'Buena', 'Fuerte'];

  document.querySelectorAll('.toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.for);
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Ocultar' : 'Mostrar';
    });
  });

  function checks(v) {
    return {
      len: v.length >= 8,
      mix: /[a-z]/.test(v) && /[A-Z]/.test(v),
      num: /\d/.test(v),
      sym: /[^A-Za-z0-9]/.test(v)
    };
  }

  function update() {
    var c = checks(nueva.value);
    var score = 0;
    document.querySelectorAll('#rules li').forEach(function (li) {
      var ok = c[li.dataset.rule];
      li.classList.toggle('met', ok);
      if (ok) score++;
    });
    var level = nueva.value ? score : 0;
    meter.dataset.level = level;
    meterLabel.textContent = nueva.value ? 'Seguridad: ' + labels[level] : '';

    var match = confirmar.value === nueva.value;
    errConfirmar.textContent = (confirmar.value && !match) ? 'Las contraseñas no coinciden.' : '';

    var valid = actual.value.length > 0 && score === 4 && confirmar.value && match &&
                nueva.value !== actual.value;
    submit.disabled = !valid;
    status.classList.remove('show');
  }

  [actual, nueva, confirmar].forEach(function (el) { el.addEventListener('input', update); });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    errActual.textContent = '';
    if (nueva.value === actual.value) {
      errActual.textContent = 'La nueva contraseña debe ser distinta de la actual.';
      return;
    }
    // Aquí iría la llamada a tu servidor para guardar el cambio.
    status.classList.add('show');
    this.reset();
    meter.dataset.level = 0;
    meterLabel.textContent = '';
    document.querySelectorAll('#rules li').forEach(function (li) { li.classList.remove('met'); });
    submit.disabled = true;
  });
})();
</script>
</body>
</html>
